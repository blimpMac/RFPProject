name: Allow Super Admin to delete managed accounts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/allow-superadmin-delete-once.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Allow deletion of legacy administrator accounts
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('src/pages/SettingsPage.tsx')
          text = settings.read_text()
          old = """        {!user.protected && !isAdministrator && (\n          <Button variant=\"danger\" disabled={busy} onClick={onRemove}>\n            <Trash2 size={16} />\n            Delete\n          </Button>\n        )}\n"""
          new = """        {!user.protected && !user.roles.includes('super_administrator') && (\n          <Button variant=\"danger\" disabled={busy} onClick={onRemove}>\n            <Trash2 size={16} />\n            Delete\n          </Button>\n        )}\n"""
          if old not in text:
              raise SystemExit('Settings delete guard anchor not found')
          settings.write_text(text.replace(old, new, 1))

          admin = Path('server/routes/administration.ts')
          text = admin.read_text()
          old = """      if (\n        targetRoles.data?.some((row) => ['super_administrator', 'administrator'].includes(row.role))\n      ) {\n        throw new HttpError(409, 'Administrative accounts cannot be removed here.');\n      }\n"""
          new = """      if (targetRoles.data?.some((row) => row.role === 'super_administrator')) {\n        throw new HttpError(409, 'The Super Administrator account cannot be removed here.');\n      }\n"""
          if old not in text:
              raise SystemExit('Administration delete guard anchor not found')
          admin.write_text(text.replace(old, new, 1))
          PY
      - run: npx prettier --write src/pages/SettingsPage.tsx server/routes/administration.ts
      - run: npm run check
      - run: rm .github/workflows/allow-superadmin-delete-once.yml
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add src/pages/SettingsPage.tsx server/routes/administration.ts .github/workflows/allow-superadmin-delete-once.yml
      - run: git commit -m "Allow Super Admin to delete managed accounts"
      - run: git push
