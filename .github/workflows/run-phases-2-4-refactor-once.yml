name: Run Phase 2-4 architecture refactor

on:
  push:
    branches:
      - refactor/phases-2-4
    paths:
      - .github/workflows/run-phases-2-4-refactor-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/setup/refactor-phases-2-4-once.py
      - run: python scripts/setup/refactor-phases-2-4-fix.py
      - run: npx prettier --write src/features/approvals/*.ts src/features/approvals/*.tsx src/pages/ApprovalsPage.tsx server/domain/access.ts server/domain/access.test.ts server/routes/staff.ts server/routes/staff/*.ts scripts/verification/architecture.test.ts docs/ARCHITECTURE.md package.json
      - run: npm run check
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add src server docs package.json scripts/verification/architecture.test.ts
      - run: git commit -m "Refactor approval and staff route architecture"
      - run: git push
