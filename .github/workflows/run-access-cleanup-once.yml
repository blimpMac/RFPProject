name: Run access model cleanup

on:
  push:
    branches:
      - access/finance-role-cleanup
    paths:
      - .github/workflows/run-access-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/setup/cleanup-legacy-admin-role-once.py
      - run: npx prettier --write server/domain/access.ts server/routes/administration/accounts.ts server/routes/staff/monitoring.ts server/routes/staff/profile.ts server/routes/staff.ts src/types/index.ts src/layouts/AdminLayout.tsx src/pages/SettingsPage.tsx src/features/accounts/AccountManagementForms.tsx src/features/profile/EditNameModal.tsx docs/ARCHITECTURE.md
      - run: npm run check
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add src server docs
      - run: git commit -m "Remove legacy administrator access and add profile name editing"
      - run: git push
