name: Fix dashboard departments once

on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-departments-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Patch dashboard department options
        run: |
          python <<'PY'
          from pathlib import Path

          backend = Path('server/routes/staff/dashboard.ts')
          text = backend.read_text()
          old = "import { isDepartmentOnly } from '../../lib/staff-access.js';"
          new = "import { isDepartmentOnly, normalizeDepartment } from '../../lib/staff-access.js';"
          if text.count(old) != 1:
              raise SystemExit('backend import marker not found exactly once')
          text = text.replace(old, new)

          old = """    const departmentOnly = isDepartmentOnly(staff.roles);\n    if (departmentOnly) {\n      const departments = await getAssignedDepartments(db, staff.user.id);\n      if (!departments.length) {\n        throw new HttpError(403, 'Your approver account has no department assignment.');\n      }\n      requestQuery = requestQuery.in('normalized_department', departments);\n    }\n    const [metrics, requests] = await Promise.all([\n      db.from('dashboard_metrics').select('*').single(),\n      requestQuery,\n    ]);\n    if (metrics.error) throw metrics.error;\n    if (requests.error) throw requests.error;\n"""
          new = """    const departmentOnly = isDepartmentOnly(staff.roles);\n    let assignedDepartments: string[] = [];\n    if (departmentOnly) {\n      assignedDepartments = await getAssignedDepartments(db, staff.user.id);\n      if (!assignedDepartments.length) {\n        throw new HttpError(403, 'Your approver account has no department assignment.');\n      }\n      requestQuery = requestQuery.in('normalized_department', assignedDepartments);\n    }\n    const [metrics, requests, submissionOptions] = await Promise.all([\n      db.from('dashboard_metrics').select('*').single(),\n      requestQuery,\n      db.from('system_settings').select('value').eq('key', 'submission_options').maybeSingle(),\n    ]);\n    if (metrics.error) throw metrics.error;\n    if (requests.error) throw requests.error;\n    if (submissionOptions.error) throw submissionOptions.error;\n"""
          if text.count(old) != 1:
              raise SystemExit('backend query marker not found exactly once')
          text = text.replace(old, new)

          old = """    const logs = await logsQuery;\n    return json(200, {\n      ok: true,\n      metrics: metrics.data,\n      requests: dashboardRequests,\n      recentActivity: logs.data || [],\n    });\n"""
          new = """    const logs = await logsQuery;\n    const configuredDepartments = Array.isArray(\n      (submissionOptions.data?.value as { departments?: unknown } | null)?.departments,\n    )\n      ? ((submissionOptions.data?.value as { departments: unknown[] }).departments.filter(\n          (department): department is string =>\n            typeof department === 'string' && Boolean(department.trim()),\n        ))\n      : [];\n    const departmentLabels = new Map<string, string>();\n    for (const department of [\n      ...configuredDepartments,\n      ...(requests.data || []).map((request) => request.department),\n    ]) {\n      const label = String(department || '').trim();\n      if (!label) continue;\n      departmentLabels.set(normalizeDepartment(label), label);\n    }\n    const departments = (departmentOnly\n      ? assignedDepartments.map((department) => departmentLabels.get(department) || department)\n      : [...departmentLabels.values()]\n    ).sort((a, b) => a.localeCompare(b));\n    return json(200, {\n      ok: true,\n      metrics: metrics.data,\n      departments,\n      requests: dashboardRequests,\n      recentActivity: logs.data || [],\n    });\n"""
          if text.count(old) != 1:
              raise SystemExit('backend response marker not found exactly once')
          backend.write_text(text.replace(old, new))

          frontend = Path('src/pages/DashboardPage.tsx')
          text = frontend.read_text()
          old = """type Dashboard = {\n  metrics: Record<string, number>;\n  requests: RequestRow[];\n  recentActivity: Record<string, unknown>[];\n};\n"""
          new = """type Dashboard = {\n  metrics: Record<string, number>;\n  departments?: string[];\n  requests: RequestRow[];\n  recentActivity: Record<string, unknown>[];\n};\n"""
          if text.count(old) != 1:
              raise SystemExit('frontend type marker not found exactly once')
          text = text.replace(old, new)

          old = "  const departments = [...new Set(data!.requests.map((request) => request.department))];"
          new = """  const departments = data!.departments?.length\n    ? data!.departments\n    : [...new Set(data!.requests.map((request) => request.department))].sort((a, b) =>\n        a.localeCompare(b),\n      );"""
          if text.count(old) != 1:
              raise SystemExit('frontend department marker not found exactly once')
          frontend.write_text(text.replace(old, new))
          PY
      - run: npx prettier --write server/routes/staff/dashboard.ts src/pages/DashboardPage.tsx
      - run: npm run check
      - name: Commit dashboard department fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/staff/dashboard.ts src/pages/DashboardPage.tsx
          git commit -m "Fix Overview department options"
          git push
