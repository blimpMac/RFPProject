name: Format navigation fix once
on:
  push:
    branches: [fix/universal-rfp-navigation-zoom-20261113]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply project formatting
        run: npx prettier --write src/layouts/AdminLayout.tsx src/styles/admin-shell-polish.css scripts/verification/verify-sidebar-zoom.ts .github/workflows/sidebar-zoom-regression.yml
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Formatting already consistent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/layouts/AdminLayout.tsx src/styles/admin-shell-polish.css scripts/verification/verify-sidebar-zoom.ts .github/workflows/sidebar-zoom-regression.yml
          git commit -m "style: format zoom-safe navigation"
          git push origin HEAD:fix/universal-rfp-navigation-zoom-20261113
