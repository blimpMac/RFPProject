name: Format sidebar refinement
on:
  push:
    branches:
      - ui/sidebar-profile-polish-20261113
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: true
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format changed files
        run: npx prettier --write src/layouts/AdminLayout.tsx src/styles/admin-shell-polish.css src/main.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/layouts/AdminLayout.tsx src/styles/admin-shell-polish.css src/main.tsx
          git commit -m "style: format sidebar and profile refinements"
          git push origin HEAD:ui/sidebar-profile-polish-20261113
