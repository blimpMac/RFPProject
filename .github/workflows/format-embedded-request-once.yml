name: One-time embedded RFP form formatting
on:
  push:
    branches: [main]
    paths: [.github/workflows/format-embedded-request-once.yml]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format request page and run all checks
        run: |
          npx prettier --write src/pages/RequestPage.tsx
          npm run check
      - name: Commit formatting-only change
        run: |
          if ! git diff --quiet -- src/pages/RequestPage.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/RequestPage.tsx
            git commit -m "Format embedded RFP submission form"
            git push origin HEAD:main
          fi
