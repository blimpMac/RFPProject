name: Apply RFP workflow remap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Repair and compile workflow remap
        run: |
          python scripts/setup/fix-workflow-remap.py
          python -m py_compile scripts/setup/apply-workflow-remap.py
      - name: Apply workflow remap
        run: python scripts/setup/apply-workflow-remap.py
      - run: npm ci
      - name: Format generated and modified code
        run: npm run format
      - name: Validate full application
        run: npm run check
      - name: Commit validated workflow remap
        run: |
          rm scripts/setup/apply-workflow-remap.py
          rm scripts/setup/fix-workflow-remap.py
          rm .github/workflows/apply-rfp-workflow-remap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remap RFP approval and digital receipt workflow"
          git push
