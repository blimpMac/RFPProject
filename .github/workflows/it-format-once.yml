name: Format IT Update Once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install formatter
        run: npm ci --ignore-scripts
      - name: Apply project formatting
        run: npx prettier --write "{api,scripts,server,src}/**/*.{ts,tsx,css}" "*.{js,json,ts}" "docs/**/*.md" ".github/**/*.{yml,yaml}"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: format IT administration changes"
          git push origin HEAD:main
