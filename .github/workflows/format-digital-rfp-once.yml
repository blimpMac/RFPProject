name: Format Digital RFP once

on:
  push:
    paths:
      - 'src/components/DigitalRfpReceipt.tsx'
      - 'src/styles/digital-rfp.css'
      - '.github/workflows/format-digital-rfp-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/DigitalRfpReceipt.tsx src/styles/digital-rfp.css
      - run: npm run check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DigitalRfpReceipt.tsx src/styles/digital-rfp.css
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git commit -m "Format square Digital RFP receipt"
          git push
