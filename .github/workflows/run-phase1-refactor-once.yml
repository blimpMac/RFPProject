name: Run Phase 1 architecture refactor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-phase1-refactor-once.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/setup/refactor-phase1-once.py
      - run: npx prettier --write src/pages/SettingsPage.tsx src/features/accounts/AccountManagementForms.tsx server/routes/administration.ts server/routes/administration/accounts.ts server/routes/staff.ts server/routes/staff/dashboard.ts src/features/requests/sla.ts src/pages/DashboardPage.tsx src/pages/TrackPage.tsx docs/ARCHITECTURE.md
      - run: npm run check
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add src server docs
      - run: git commit -m "Refactor account and dashboard architecture"
      - run: git push
