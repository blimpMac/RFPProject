name: Format profile UX changes

on:
  push:
    branches:
      - ux/profile-modal-sidebar
    paths:
      - .github/workflows/format-profile-ux.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/layouts/AdminLayout.tsx src/pages/SettingsPage.tsx
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add src/layouts/AdminLayout.tsx src/pages/SettingsPage.tsx
      - run: git diff --cached --quiet || git commit -m "Format profile UX changes"
      - run: git push
