name: One-time RFP code formatting
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-rfp-now.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository formatter and run all checks
        run: |
          npm run format
          npm run check
      - name: Commit formatting-only changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Apply Prettier formatting to audited RFP changes"
            git push origin HEAD:main
          fi
