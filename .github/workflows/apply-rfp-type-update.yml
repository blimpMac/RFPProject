name: Apply RFP type update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-rfp-types:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply RFP type and checklist update
        run: python scripts/setup/apply-rfp-type-checklist-update.py
      - run: npm ci
      - name: Format modified code
        run: npm run format
      - name: Validate full application
        run: npm run check
      - name: Commit validated update
        run: |
          rm scripts/setup/apply-rfp-type-checklist-update.py
          rm .github/workflows/apply-rfp-type-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update RFP type dropdown and document checklist"
          git push
