name: Code quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Inspect formatted supporting-documents component
        run: |
          npx prettier src/components/RequestSupportingDocuments.tsx --write
          git diff -- src/components/RequestSupportingDocuments.tsx
      - run: npm run check
