name: Format RFP Branded Recovery Once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-recovery-mail-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Node.js
        uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format recovery code and docs
        run: npx prettier --write server/email/recovery.ts server/email/recovery-template.ts server/email/recovery-template.test.ts server/routes/recovery.ts server/api.ts src/pages/PasswordRecoveryPage.tsx scripts/verification/architecture.test.ts docs/PASSWORD_RECOVERY_EMAIL_SETUP.md package.json
      - name: Commit formatting to main
        run: |
          if git diff --quiet; then
            echo "Recovery code already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/email/recovery.ts server/email/recovery-template.ts server/email/recovery-template.test.ts server/routes/recovery.ts server/api.ts src/pages/PasswordRecoveryPage.tsx scripts/verification/architecture.test.ts docs/PASSWORD_RECOVERY_EMAIL_SETUP.md package.json
          git commit -m "style: format branded SMTP recovery"
          git push origin HEAD:main
