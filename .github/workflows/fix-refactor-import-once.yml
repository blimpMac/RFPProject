name: Fix Phase 1 refactor import

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-refactor-import-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add requestDeadline to generated dashboard import
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/refactor-phase1-fixed-once.yml')
          text = path.read_text()
          old = "{ manilaDay, requestSlaStatus, type SlaStatus }"
          new = "{ manilaDay, requestDeadline, requestSlaStatus, type SlaStatus }"
          if old not in text:
            raise SystemExit('Expected import template was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: rm .github/workflows/fix-refactor-import-once.yml
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add .github/workflows/refactor-phase1-fixed-once.yml .github/workflows/fix-refactor-import-once.yml
      - run: git commit -m "Fix SLA import in Phase 1 refactor"
      - run: git push
