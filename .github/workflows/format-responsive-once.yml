name: Format responsive fixes once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-responsive-once.yml'

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format responsive changes
        run: npx prettier --write scripts/verification/verify-live-responsive.ts src/styles/digital-rfp.css
      - name: Validate application
        run: npm run check
      - name: Commit validated responsive fixes
        run: |
          rm .github/workflows/format-responsive-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verification/verify-live-responsive.ts src/styles/digital-rfp.css .github/workflows/format-responsive-once.yml
          git commit -m "Validate responsive layout fixes"
          git push
