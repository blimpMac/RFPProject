name: Apply Finance Head role

on:
  push:
    branches: [main]
    paths:
      - scripts/setup/apply-finance-head-role.py
      - .github/workflows/apply-finance-head-role.yml

permissions:
  contents: write

jobs:
  update-finance-head-role:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply Finance Head role patch
        run: python scripts/setup/apply-finance-head-role.py
      - name: Install dependencies
        run: npm ci
      - name: Format modified code
        run: npm run format
      - name: Validate full application
        run: npm run check
      - name: Commit validated update
        run: |
          rm scripts/setup/apply-finance-head-role.py
          rm .github/workflows/apply-finance-head-role.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Finance Head role"
          git push origin main
