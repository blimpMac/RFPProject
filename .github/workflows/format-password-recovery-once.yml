name: Format RFP Password Recovery Once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-password-recovery-once.yml
permissions:
  contents: write
jobs:
  format-recovery:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Format updated recovery files
        run: npx prettier --write src/pages/PasswordRecoveryPage.tsx scripts/verification/architecture.test.ts docs/PASSWORD_RECOVERY_EMAIL_SETUP.md
      - name: Commit if formatting changes
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PasswordRecoveryPage.tsx scripts/verification/architecture.test.ts docs/PASSWORD_RECOVERY_EMAIL_SETUP.md
          git commit -m "style: format RFP recovery UI and setup guide"
          git push origin HEAD:main
