name: Fix Documents filters once

on:
  push:
    paths:
      - '.github/workflows/fix-documents-filters-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/tmp-fix-documents-filters.py
      - run: npx prettier --write server/routes/staff/monitoring.ts src/pages/DocumentsPage.tsx
      - run: npm run check
      - name: Commit Documents filter fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/staff/monitoring.ts src/pages/DocumentsPage.tsx
          git commit -m "Fix Documents dashboard filters"
          git push
