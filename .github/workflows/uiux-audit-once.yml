name: Apply UI UX Pro Max refinements once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uiux-audit-once.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply UI UX refinement patch
        run: python3 scripts/setup/apply-uiux-refinement.py
      - name: Install dependencies
        run: npm ci
      - name: Format changed application files
        run: npm run format
      - name: Validate application
        run: npm run check
      - name: Commit validated refinements
        run: |
          git rm .github/workflows/uiux-audit-once.yml scripts/setup/apply-uiux-refinement.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ui.tsx src/components/DataTable.tsx src/layouts/AdminLayout.tsx src/pages/RequestPage.tsx src/main.tsx src/styles/ux-refinement.css
          git commit -m "Refine website UX with UI UX Pro Max"
          git push origin main
