name: Format IT profile and technical manual once
on:
  push:
    branches: [fix/it-self-profile-name-20261113]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply formatter to changed files
        run: npx prettier --write src/pages/ManualPage.tsx src/layouts/AdminLayout.tsx server/routes/staff/profile.ts scripts/verification/architecture.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ManualPage.tsx src/layouts/AdminLayout.tsx server/routes/staff/profile.ts scripts/verification/architecture.test.ts
          git commit -m "style: format IT profile and technical manual"
          git push origin HEAD:fix/it-self-profile-name-20261113
