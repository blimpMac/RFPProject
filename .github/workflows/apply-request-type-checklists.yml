name: Apply request type checklists

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply request type and checklist changes
        run: python scripts/setup/apply-request-type-checklists.py
      - run: npm ci
      - name: Format changed files
        run: npm run format
      - name: Validate application
        run: npm run check
      - name: Commit validated changes
        run: |
          rm scripts/setup/apply-request-type-checklists.py
          rm .github/workflows/apply-request-type-checklists.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update RFP types and document checklists"
          git push
