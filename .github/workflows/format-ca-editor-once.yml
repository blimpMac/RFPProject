name: One-time CA liquidation editor formatting
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/format-ca-editor-once.yml

permissions:
  contents: write

jobs:
  format-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed CA editor files
        run: npx prettier --write src/components/CaLiquidationEditor.tsx src/styles/ca-liquidation-editor.css
      - name: Run all quality checks and tests
        run: npm run check
      - name: Commit formatting-only changes to main
        run: |
          if ! git diff --quiet -- src/components/CaLiquidationEditor.tsx src/styles/ca-liquidation-editor.css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/CaLiquidationEditor.tsx src/styles/ca-liquidation-editor.css
            git commit -m "Format CA liquidation editor for consistent RFP styling"
            git push origin HEAD:main
          fi
