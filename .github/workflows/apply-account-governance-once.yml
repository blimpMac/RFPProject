name: Apply account governance once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply governance changes
        run: |
          python scripts/temporary/apply-account-governance.py
          sed -i "/import { administrativeRoles } from '..\/domain\/access.js';/d" server/services/finance-stage-workflow.ts
      - run: npm ci
      - name: Format modified code
        run: npx prettier --write server/routes/administration.ts server/services/account-governance.ts server/services/finance-stage-workflow.ts src/pages/SettingsPage.tsx src/pages/ApprovalsPage.tsx src/layouts/AdminLayout.tsx src/pages/ApprovingHeadsPage.tsx scripts/setup/promote-superadmin.ts
      - name: Validate full application
        run: npm run check
      - name: Commit validated update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-account-governance-once.yml scripts/temporary/apply-account-governance.py
          git add server/routes/administration.ts server/services/account-governance.ts server/services/finance-stage-workflow.ts src/pages/SettingsPage.tsx src/pages/ApprovalsPage.tsx src/layouts/AdminLayout.tsx src/pages/ApprovingHeadsPage.tsx scripts/setup/promote-superadmin.ts
          git commit -m 'Enforce Super Admin and department account governance'
          git push origin main
