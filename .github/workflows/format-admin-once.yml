name: Format admin route once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/format-admin-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write server/routes/administration.ts
      - run: npm run check
      - run: rm .github/workflows/format-admin-once.yml
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add server/routes/administration.ts .github/workflows/format-admin-once.yml
      - run: git commit -m "Validate Super Admin email management"
      - run: git push
