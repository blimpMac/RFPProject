project_id = "rfp-project"

[auth]
additional_redirect_urls = ["https://greenlight-rfp.vercel.app/admin", "https://greenlight-rfp.vercel.app/admin/login", "https://greenlight-rfp.vercel.app/admin/reset-password", "http://localhost:5173/**", "http://localhost:8888/**"]
site_url = "https://greenlight-rfp.vercel.app"

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

# Used only by local Supabase CLI / self-hosted environments.
# Hosted RFP Auth email content and sender must be configured in the Supabase dashboard.
[auth.email.template.recovery]
subject = "RFP Monitoring System | Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.analytics]
enabled = true
max_namespaces = 10

[storage.image_transformation]
enabled = true
